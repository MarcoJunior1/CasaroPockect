[platformio]
build_dir = C:\CasaroColarBuild

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    lvgl/lvgl @ ~8.3.11
    bodmer/TFT_eSPI @ ~2.5.43
build_flags =
    -D USER_SETUP_LOADED=1
    -D GC9A01_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_MOSI=11
    -D TFT_SCLK=12
    -D TFT_CS=10
    -D TFT_DC=9
    -D TFT_RST=14
    -D LOAD_GLCD=1
    -D SPI_FREQUENCY=27000000
    -D LV_CONF_SKIP
    -D LV_TICK_CUSTOM=1
    -D LV_COLOR_DEPTH=16
    -D LV_FONT_MONTSERRAT_12=1
    -D LV_FONT_MONTSERRAT_32=1
